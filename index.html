<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="写真をブロックの立体にして、こぶしや武器でぶっ壊すブラウザゲーム">
<title>ドット爆破</title>
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* レイアウト: 上にタイトル、中央に一人称の3Dステージ、その下に設定。
   ぶきのアイテム欄は画面の下に常に固定。8ビットの宇宙、強い色は爆発のオレンジだけ。 */
:root {
  --bg: #0c0a1f;
  --panel: #181433;
  --line: #35306b;
  --ink: #eceaff;
  --muted: #a3a0d4;
  --fire: #ff7a1a;
  --fire-hi: #ffd23f;
  --slot: #0c0a1f;
  --font-display: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-util: "Press Start 2P", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 14px calc(150px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
h1 {
  margin: 0; font-size: 28px; font-weight: 400; letter-spacing: 0.08em;
  color: var(--fire-hi); text-shadow: 3px 3px 0 var(--fire); text-wrap: balance;
}
.actions { display: flex; flex-wrap: wrap; gap: 12px 14px; }
.btn {
  --edge: var(--line);
  font: inherit; font-size: 15px; color: var(--ink); background: var(--panel);
  border: 0; border-radius: 0; padding: 8px 14px; min-height: 40px; margin: 3px; cursor: pointer;
  box-shadow: -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge), 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge);
}
.btn:hover { filter: brightness(1.18); }
.btn:active { transform: translateY(2px); }
.btn:focus-visible, .slot:focus-visible, input[type="range"]:focus-visible { outline: 3px dashed var(--fire-hi); outline-offset: 5px; }
.btn.primary, .btn[aria-pressed="true"] { --edge: var(--fire-hi); background: var(--fire); color: #1a0a00; }
.stage {
  position: relative; margin: 3px; line-height: 0; background: #120e30;
  box-shadow: -3px 0 0 0 var(--line), 3px 0 0 0 var(--line), 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line);
}
.stage.drop { outline: 3px dashed var(--fire-hi); outline-offset: 8px; }
.stage canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
#fx { position: absolute; inset: 0; height: 100%; cursor: none; touch-action: none; -webkit-user-select: none; user-select: none; }
.status { margin: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.panel {
  margin: 3px; padding: 16px; background: var(--panel); display: grid; gap: 20px;
  box-shadow: -3px 0 0 0 var(--line), 3px 0 0 0 var(--line), 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line);
}
.row { display: grid; gap: 8px; min-width: 0; }
.row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.label { font-size: 16px; }
.readout { font-family: var(--font-util); font-size: 11px; color: var(--fire-hi); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 12px 14px; }
input[type="range"] { width: 100%; accent-color: var(--fire); margin: 6px 0; }

/* アイテム欄（画面の下に固定） */
.hotbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--panel); border-top: 3px solid var(--line);
  padding-top: 8px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hotbar-in { max-width: 520px; margin: 0 auto; display: grid; gap: 6px; }
.hb-label { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 2px 10px; min-height: 1.6em; text-align: center; }
.hb-name { font-size: 17px; color: var(--fire-hi); }
.hb-hint { font-size: 13px; color: var(--muted); }
.slots { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.slot {
  position: relative; aspect-ratio: 1; max-height: 68px; width: 100%; padding: 0; margin: 0;
  background: var(--slot); border: 3px solid var(--line); border-radius: 0;
  display: grid; place-items: center; cursor: pointer; color: var(--muted);
}
.slot:hover { border-color: var(--muted); }
.slot[aria-pressed="true"] { border-color: var(--fire-hi); background: #2b1a12; box-shadow: 0 0 0 3px var(--fire); }
.slot canvas { width: 66%; height: auto; image-rendering: pixelated; pointer-events: none; }
.slot .num { position: absolute; left: 3px; top: 2px; font-family: var(--font-util); font-size: 8px; line-height: 1; }
@media (prefers-reduced-motion: no-preference) {
  .slot { transition: transform 0.08s; }
  .slot[aria-pressed="true"] { transform: translateY(-3px); }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>ドット爆破</h1>
    <div class="actions">
      <button class="btn primary" id="pick" type="button">画像をえらぶ</button>
      <button class="btn" id="reset" type="button">もとにもどす</button>
    </div>
  </div>

  <div class="stage" id="stageBox">
    <canvas id="gl" width="480" height="600"></canvas>
    <canvas id="fx" width="480" height="600" role="img" aria-label="一人称視点のステージ。画像をブロックの立体にしたものをねらって、えらんだぶきでこわします"></canvas>
  </div>
  <p class="status" id="status" aria-live="polite">よみこみ中…</p>

  <div class="panel">
    <div class="row">
      <div class="row-head">
        <label class="label" for="yaw">向き</label>
        <span class="readout" id="yawOut">20°</span>
      </div>
      <input type="range" id="yaw" min="-180" max="180" step="1" value="20">
      <div class="seg">
        <button class="btn" type="button" id="spin" aria-pressed="false">くるくる回す</button>
      </div>
    </div>
    <div class="row">
      <span class="label" id="sizeLabel">いりょく</span>
      <div class="seg" role="group" aria-labelledby="sizeLabel">
        <button class="btn" type="button" data-size="0" aria-pressed="false">小</button>
        <button class="btn" type="button" data-size="1" aria-pressed="true">中</button>
        <button class="btn" type="button" data-size="2" aria-pressed="false">大</button>
      </div>
    </div>
    <div class="row">
      <div class="row-head">
        <label class="label" for="scale">大きさ</label>
        <span class="readout" id="scaleOut">100%</span>
      </div>
      <input type="range" id="scale" min="40" max="250" step="10" value="100">
      <p class="note">こわしかけのままでも、大きさだけ変えられます。</p>
    </div>
    <div class="row">
      <span class="label" id="bgLabel">背景を消して形だけ立体にする</span>
      <div class="seg">
        <button class="btn" type="button" id="bg" aria-pressed="true" aria-labelledby="bgLabel bg">ON</button>
      </div>
      <p class="note">写真のまわりの背景を消して、写っているものだけをふくらませた立体にします。うまく消えないときは OFF にしてください。</p>
    </div>
    <div class="row">
      <span class="label" id="soundLabel">おと</span>
      <div class="seg">
        <button class="btn" type="button" id="sound" aria-pressed="true" aria-labelledby="soundLabel sound">ON</button>
      </div>
    </div>
  </div>
</div>

<nav class="hotbar" aria-label="ぶき">
  <div class="hotbar-in">
    <p class="hb-label"><span class="hb-name" id="hbName"></span><span class="hb-hint" id="hbHint"></span></p>
    <div class="slots" id="slots" role="group" aria-label="ぶきをえらぶ"></div>
  </div>
</nav>
<input type="file" id="file" accept="image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  var statusEl = document.getElementById('status');

  var WEAPONS = [
    { id: 'fist', name: 'こぶし', hold: true, rate: 0.15, hint: 'タップでパンチ。おしっぱなしで連続パンチ' },
    { id: 'rocket', name: 'ロケット', hold: false, hint: 'タップした所にロケット発射' },

    { id: 'hammer', name: 'ハンマー', hold: false, hint: 'タップした所をたたきつぶす' },

    { id: 'laser', name: 'レーザー', hold: true, rate: 0, hint: 'おしながらなぞると溶ける' }
  ];
  var RADIUS = { fist: 0.75, rocket: 0.8, gun: 0.13, hammer: 0.95, bolt: 0.65, meteor: 1.3, laser: 0.13 };

  var MAP_PAL = { K: '#0c0a1f', W: '#eceaff', O: '#ff7a1a', Y: '#ffd23f', R: '#ff4d6d', G: '#8f8cc9', D: '#4a4690', B: '#7fe0ff', N: '#8a5a2b', S: '#f2c6a0', s: '#c98a64' };
  var ICONS = {
    fist: ['............', '..KKKKKKKK..', '.KSSsSSsSSK.', '.KSSsSSsSSK.', '.KSSsSSsSSK.', '.KssssssssK.', '.KSSSSSSSsK.', '.KKKKKSSSsK.', '..KSSSSSssK.', '..KsssssssK.', '...KKKKKKK..', '............'],
    rocket: ['............', '............', '...OO.......', '..OOWWWWWR..', 'YOOWWWWWWRR.', 'YOOWWWWWWRR.', '..OOWWWWWR..', '...OO.......', '............', '............', '............', '............'],
    gun: ['............', '............', '............', '.GGGGGGGGGG.', 'GDDDDDDDDDGG', '.GGGGGGGGGG.', '.DDGGK......', '..DGG.......', '..DGG.......', '...DD.......', '............', '............'],
    hammer: ['............', '.GGGGGGGG...', '.GWWWWWWG...', '.GWWWWWWG...', '.GGGGGGGG...', '....NN......', '....NN......', '....NN......', '....NN......', '....NN......', '....KK......', '............'],
    bolt: ['......YYYY..', '.....YYYY...', '....YYYY....', '...YYYY.....', '..YYYYYYYY..', '......YYY...', '.....YYY....', '....YYY.....', '...YY.......', '..Y.........', '............', '............'],
    meteor: ['..........Y.', '.........O..', '........OO..', '...OOOOOO...', '..ORRRRRO...', '.ORRYYRRRO..', '.ORYWWYRRO..', '.ORRYYRRRO..', '..ORRRRRO...', '...OOOOO....', '............', '............'],
    laser: ['............', '............', 'BBBBBBB.....', 'WWWWWWWWBB..', 'BBBBBBB.....', '............', '...GGGGGGG..', '..GDDDDDDGG.', '...GGGGGGG..', '....DD......', '............', '............']
  };
  var TUBE = {
    rocket: { bxr: 0.64, len: 185, wb: 52, wt: 26, cl: '#a9a6e6', cr: '#6c68b8' },
    gun: { bxr: 0.62, len: 190, wb: 30, wt: 16, cl: '#9a9ab8', cr: '#52526f' },
    laser: { bxr: 0.64, len: 175, wb: 42, wt: 22, cl: '#6fd0f0', cr: '#2c78a0' }
  };
  var PALS = {

    dust: ['#eceaff', '#a3a0d4', '#6c68b8', '#35306b'],
    bolt: ['#ffffff', '#fff7a8', '#ffe86b', '#9fe8ff', '#4a4690'],
    hot: ['#ffffff', '#ffb347', '#ff7a1a', '#c2381f', '#4a3a63']
  };
  var FIRE3 = ['#ff7a1a', '#ffd23f', '#ffffff'];
  var BOLT3 = ['#9fe8ff', '#fff7a8', '#ffffff'];

    var h = map.length, w = map[0].length, sz = Math.ceil(sc);
    for (var r = 0; r < h; r++) {
      for (var q = 0; q < w; q++) {

        var qx = flip ? (w - 1 - q) : q;
        c.fillStyle = MAP_PAL[ch];
        c.fillRect(Math.round(x + (qx - w / 2) * sc), Math.round(y + (r - h / 2) * sc), sz, sz);
      }
    }
  }

  if (typeof THREE === 'undefined') {
    statusEl.textContent = '3Dの部品が読みこめませんでした。ページを開きなおしてください';
    return;
  }

  /* ---------- 3Dの準備 ---------- */
  var glCanvas = document.getElementById('gl');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: false }); }
  catch (e) { statusEl.textContent = 'このブラウザでは3D表示が使えません。別のブラウザで開いてみてください'; return; }
  renderer.setPixelRatio(1);
  renderer.setSize(RW, RH, false);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x120e30);
  scene.fog = new THREE.Fog(0x120e30, 18, 50);
  var camera = new THREE.PerspectiveCamera(FOV, RW / RH, 0.05, 200);
  var CAM = new THREE.Vector3(0, 3, 7), LOOK = new THREE.Vector3(0, 2.5, 0);
  camera.position.copy(CAM); camera.lookAt(LOOK);

  scene.add(new THREE.HemisphereLight(0xc9c4ff, 0x2a1a5a, 0.55));
  var sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(-4, 7, 6); scene.add(sun);
  var rim = new THREE.DirectionalLight(0x9fb4ff, 0.3);
  rim.position.set(5, 2, -4); scene.add(rim);
  var flashLight = new THREE.PointLight(0xffa040, 0, 9, 2);
  scene.add(flashLight);
  var lightE = 0;

  (function makeWorld() {
    var gc = document.createElement('canvas'); gc.width = gc.height = 32;
    var gg = gc.getContext('2d');
    gg.fillStyle = '#15103a'; gg.fillRect(0, 0, 32, 32);
    gg.fillStyle = '#110c2e'; gg.fillRect(0, 0, 16, 16); gg.fillRect(16, 16, 16, 16);
    gg.fillStyle = '#2e2868'; gg.fillRect(0, 0, 32, 1); gg.fillRect(0, 0, 1, 32);

    gtex.magFilter = THREE.NearestFilter;
    gtex.wrapS = gtex.wrapT = THREE.RepeatWrapping; gtex.repeat.set(60, 60);

    ground.rotation.x = -Math.PI / 2; scene.add(ground);

    var sp = [];
    for (var i = 0; i < 420; i++) {
      var a = Math.random() * Math.PI * 2, el = 0.04 + Math.random() * 1.2, r = 90;
      sp.push(Math.cos(a) * Math.cos(el) * r, Math.sin(el) * r, Math.sin(a) * Math.cos(el) * r);
    }
    var sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
    scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, fog: false })));

    var mtMat = new THREE.MeshLambertMaterial({ color: 0x241a5e });
    for (var k = 0; k < 28; k++) {
      var h = 2 + Math.random() * 8, w = 3 + Math.random() * 6, t = -1.35 + k / 27 * 2.7;
      var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mtMat);
      m.position.set(Math.sin(t) * 38, h / 2, -Math.cos(t) * 38 + 4);
      scene.add(m);
    }
  })();

  var obj = new THREE.Group();
  scene.add(obj);
  var blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false }));

  var cubeGeo = new THREE.BoxGeometry(1, 1, 1);
  var wallMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  var debMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

  function mult() { return POWER[powerIndex]; }

  /* ---------- サンプル画像（惑星） ---------- */
  function makeSample() {
    var c = document.createElement('canvas'); c.width = c.height = 320;
    var g = c.getContext('2d');
    var cx = 160, cy = 165, r = 84;
    function ring(a0, a1) {

    g.beginPath(); g.arc(cx + 34, cy - 26, 7, 0, 6.3); g.fill();

  /* ---------- 画像 → ドット ---------- */
  function pixelate(el) {
    var sw = el.naturalWidth || el.width, sh = el.naturalHeight || el.height;
    var N = GRID, k = N / Math.max(sw, sh);

    var fg = f.getContext('2d', { willReadFrequently: true });

      try { build(); }
      catch (e) { statusEl.textContent = '立体にできませんでした。ブロックの細かさを下げてもう一度ためしてください'; }
    }, 20);
  }
  function loadFile(f) {
    if (!f || !/^image\//.test(f.type)) { statusEl.textContent = '画像ファイル（JPG・PNGなど）をえらんでください'; return; }
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () { src = { el: img, name: f.name, sample: false }; safeBuild(); };
      img.onerror = function () { statusEl.textContent = 'この画像は読みこめませんでした。JPGかPNGで試してください'; };
      img.src = rd.result;
    };
    rd.onerror = function () { statusEl.textContent = 'ファイルを読みこめませんでした'; };
    rd.readAsDataURL(f);
  }

  var box = document.getElementById('stageBox');
  box.addEventListener('dragover', function (e) { e.preventDefault(); box.classList.add('drop'); });
  box.addEventListener('dragleave', function () { box.classList.remove('drop'); });
  box.addEventListener('drop', function (e) {
    e.preventDefault(); box.classList.remove('drop');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  /* アイテム欄 */
  var slotBox = document.getElementById('slots');
  var hbName = document.getElementById('hbName'), hbHint = document.getElementById('hbHint');
  var slotBtns = [];
  function selectWeapon(i) {
    stopHold(); wi = i;
    slotBtns.forEach(function (b, bi) { b.setAttribute('aria-pressed', bi === i ? 'true' : 'false'); });
    hbName.textContent = (i + 1) + '. ' + WEAPONS[i].name;
    hbHint.textContent = WEAPONS[i].hint;
  }
  WEAPONS.forEach(function (wp, i) {
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'slot';
    btn.setAttribute('aria-label', (i + 1) + ' ' + wp.name);
    btn.setAttribute('aria-pressed', 'false');
    var num = document.createElement('span'); num.className = 'num'; num.textContent = String(i + 1);
    var ic = document.createElement('canvas'); ic.width = 36; ic.height = 36;
    drawMap(ic.getContext('2d'), ICONS[wp.id], 18, 18, 3, false);
    btn.appendChild(ic); btn.appendChild(num);
    btn.addEventListener('click', function () { selectWeapon(i); });
    slotBox.appendChild(btn); slotBtns.push(btn);
  });
  window.addEventListener('keydown', function (e) {
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= WEAPONS.length && !e.ctrlKey && !e.metaKey && !e.altKey) selectWeapon(n - 1);
  });
  var wheelAt = 0;
  fx.addEventListener('wheel', function (e) {
    e.preventDefault();
    var now = performance.now();
    if (now - wheelAt < 120 || Math.abs(e.deltaY) < 4) return;
    wheelAt = now;
    var n = WEAPONS.length;
    selectWeapon((wi + (e.deltaY > 0 ? 1 : -1) + n) % n);
  }, { passive: false });

  yawEl.addEventListener('input', function () {
    yaw = (parseInt(yawEl.value, 10) || 0) * Math.PI / 180;
    yawOut.textContent = yawEl.value + '°';
  });
  var spinBtn = document.getElementById('spin');
  spinBtn.addEventListener('click', function () {
    spinOn = !spinOn;
    spinBtn.setAttribute('aria-pressed', spinOn ? 'true' : 'false');
  });

  var scaleEl = document.getElementById('scale'), scaleOut = document.getElementById('scaleOut');
  scaleEl.addEventListener('input', function () {
    objScale = (parseInt(scaleEl.value, 10) || 100) / 100;
    scaleOut.textContent = scaleEl.value + '%';
    obj.scale.setScalar(objScale);
    frameCamera(false);
  });

  var bgBtn = document.getElementById('bg');
  bgBtn.addEventListener('click', function () {
    bgOn = !bgOn;
    bgBtn.setAttribute('aria-pressed', bgOn ? 'true' : 'false');
    bgBtn.textContent = bgOn ? 'ON' : 'OFF';
    if (src) safeBuild();
  });

  var sizeBtns = document.querySelectorAll('[data-size]');
  Array.prototype.forEach.call(sizeBtns, function (btn) {
    btn.addEventListener('click', function () {
      powerIndex = parseInt(btn.getAttribute('data-size'), 10);
      Array.prototype.forEach.call(sizeBtns, function (o) { o.setAttribute('aria-pressed', o === btn ? 'true' : 'false'); });
    });
  });

  var soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    soundBtn.textContent = soundOn ? 'ON' : 'OFF';
    if (!soundOn) laserOff();
  });

  showYaw();
  selectWeapon(0);
  src = { el: makeSample(), name: 'サンプル（惑星）', sample: true };
  obj.rotation.y = yaw;
  updateCamera(0);
  build();
  updateCamera(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
